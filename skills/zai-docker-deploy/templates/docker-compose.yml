services:
  app:
    build:
      context: .
      args:
        BUILD_ID: ${BUILD_ID:-local}
    image: "${IMAGE_NAME:-zai-app}:${IMAGE_TAG:-local}"
    container_name: "${CONTAINER_NAME:-zai-app}"
    ports:
      - "${PORT_CADDY:-8081:81}"    # Caddy reverse proxy (primary entry)
      - "${PORT_APP:-3000:3000}"    # app standalone server (direct)
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Docker pre-sets HOSTNAME to the container hostname; force it back to
      # 0.0.0.0 so the app binds all interfaces (loopback included) for Caddy.
      HOSTNAME: ${HOSTNAME:-0.0.0.0}
      # start.sh already defaults to this; set explicitly for clarity.
      DATABASE_URL: ${DATABASE_URL:-file:/app/db/custom.db}
    restart: ${RESTART_POLICY:-unless-stopped}

    # Persist the SQLite db across rebuilds. Keep the default name generic so
    # the template remains reusable across ZAI deployments; override via .env if
    # a project-specific name is desired.
    # volumes:
    #   - ${VOLUME_NAME:-zai-app-db}:/app/db

# volumes:
#   ${VOLUME_NAME:-zai-app-db}:
